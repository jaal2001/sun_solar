name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/sun_solar/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version aus manifest.json lesen
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/sun_solar/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release erstellen, falls Tag noch nicht existiert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits - manifest.json version wurde vermutlich nicht erhoeht. Ueberspringe."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --target main
          fi
